name: Incremental data refresh

# 증분 갱신(CDC) 파이프라인 — 명세[realtime] §8 초안 반영.
# cron 은 UTC. KST = UTC+9. 소스별 cron 을 github.event.schedule 로 분기한다.
# 전제: 이 저장소가 git repo 로 초기화되어 있어야 커밋백이 동작(F:/policy_maps 는 아직 repo 아님).
#       무커밋 대안은 actions/cache + upload-artifact (README 참조).

# 스케줄 실행은 기본으로 꺼 둔다.
#
# 이 워크플로는 API 키 4종(secrets)을 요구한다. 포크하거나 키를 넣지 않은 저장소에서
# cron 이 돌면 매일 실패해 Actions 탭이 빨간 X 로 채워진다 — 파이프라인이 고장 난 것처럼
# 보이지만 실제로는 키가 없을 뿐이다. 그래서 수동 실행(workflow_dispatch)만 남긴다.
#
# 자동 갱신을 켜려면 저장소 Settings → Secrets 에 LAW_OC / ASSEMBLY_KEY / LOFIN_KEY /
# STANREGIN_KEY 를 넣은 뒤 아래 schedule 블록의 주석을 풀면 된다.
#
# on:
#   schedule:
#     - cron: "0 21 * * 0"   # 일 21:00 UTC = 월 06:00 KST : law + ordin (주1회)
#     - cron: "0 22 * * *"   # 매일 22:00 UTC = 07:00 KST : na_bill + na_vote (일1회)
#     - cron: "0 20 1 * *"   # 매월 1일 20:00 UTC = 05:00 KST : budget (월1회)
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "쉼표구분 소스(law,ordin,na_bill,na_vote,budget,boundary)"
        required: false
        default: ""
      reorg_event:
        description: "경계 개편 이벤트 태그(예: 2026-07-01-전남광주통합). boundary 실행 시 필수"
        required: false
        default: ""

permissions:
  contents: write        # 워터마크·조각·change_log 커밋백
  issues: write          # 변경 감지 시 운영 이슈 upsert(law-freshness 패턴)
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false   # 쓰기 중 취소 금지

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: system
    env:
      LAW_OC:        ${{ secrets.LAW_OC }}
      ASSEMBLY_KEY:  ${{ secrets.ASSEMBLY_KEY }}
      LOFIN_KEY:     ${{ secrets.LOFIN_KEY }}
      STANREGIN_KEY: ${{ secrets.STANREGIN_KEY }}
      VWORLD_KEY:    ${{ secrets.VWORLD_KEY }}
      VWORLD_DOMAIN: ${{ vars.VWORLD_DOMAIN }}
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # 코어는 표준라이브러리. 3.14는 일부 휠 부재 → 3.13 고정.

      - name: Install (pure-python core; httpx optional)
        run: pip install -r requirements-core.txt

      - name: 필수 시크릿 검증
        run: |
          if [ -z "$LAW_OC" ]; then echo "LAW_OC 필요"; exit 1; fi

      - name: 실행 소스 결정
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 21 * * 0") S="law,ordin" ;;
            "0 22 * * *") S="na_bill,na_vote" ;;
            "0 20 1 * *") S="budget" ;;
            *)            S="${{ github.event.inputs.sources }}" ;;
          esac
          echo "sources=$S" >> "$GITHUB_OUTPUT"

      - name: DB 초기화(멱등)
        run: python -m policymap.run init

      - name: 증분 갱신 실행
        id: run
        run: |
          python -m policymap.run refresh \
            --sources "${{ steps.pick.outputs.sources }}" \
            --reorg-event "${{ github.event.inputs.reorg_event }}" \
            --concurrency 6 --retries 3 --error-budget 0.05
        # run.py 가 GITHUB_OUTPUT 에 changed_count/error_count/summary_path 기록.

      - name: 정적 번들 재생성(export)
        if: steps.run.outputs.changed_count != '0'
        run: python -m policymap.run export --out data/

      - name: 워터마크·조각·변경로그 커밋백
        run: |
          git config user.name  "policy-maps-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ || true
          git commit -m "chore(refresh): ${{ steps.pick.outputs.sources }} @ $(date -u +%FT%TZ) (변경 ${{ steps.run.outputs.changed_count }})" || echo "변경 없음"
          git push || echo "push skip"

      - name: 변경 감지 시 운영 이슈 upsert
        if: steps.run.outputs.changed_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-refresh --color 1D76DB --description "공식 데이터 원천 변경" --force
          n="$(gh issue list --label data-refresh --state open --json number --jq '.[0].number // empty')"
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file "${{ steps.run.outputs.summary_path }}"
          else
            gh issue create --label data-refresh --title "데이터 변경 감지" --body-file "${{ steps.run.outputs.summary_path }}"
          fi

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policymap"
version = "0.1.0"
description = "조례 그래프 분석 시스템 — 대한민국 자치법규를 지자체·시간·공간·재정 축으로 교차 분석"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "policy-maps" }]

# 코어는 표준라이브러리(sqlite3/urllib/json/csv/xml)만으로 동작한다.
# → 런타임 필수 의존성 없음. 아래는 전부 선택적(extras)이며 부재 시 graceful fallback.
dependencies = []

[project.optional-dependencies]
# 실운영 편의(HTTP 고속화). 없으면 urllib.request 폴백.
http = ["httpx>=0.27"]
# 그래프 빌드/분석 가속. 없으면 순수파이썬 인접리스트·k-means 폴백.
graph = ["networkx>=3.0"]
# 공간 인접(Queen contiguity) 정밀. 없으면 GeoJSON 링 좌표공유 폴백.
geo = ["shapely>=2.0"]
# 임베딩 고도화. 없으면 char n-gram TF 코사인 폴백.
embed = ["numpy>=1.26", "scikit-learn>=1.4", "sentence-transformers>=2.6"]
# 대용량 예산 분석(선택). 없으면 SQLite 집계.
analytics = ["duckdb>=0.10", "pyarrow>=15"]
# 로컬 스케줄러 폴백(Actions 분 소진 시). 없으면 schtasks/외부 cron.
schedule = ["apscheduler>=3.10"]
# 개발/테스트
dev = ["pytest>=8", "ruff>=0.4"]
# 전체(무거운 휠 포함 — Python 3.14에서는 일부 미빌드 가능, 3.11~3.13 권장)
full = [
  "httpx>=0.27", "networkx>=3.0", "shapely>=2.0",
  "numpy>=1.26", "scikit-learn>=1.4", "sentence-transformers>=2.6",
  "duckdb>=0.10", "pyarrow>=15", "apscheduler>=3.10",
]

[project.scripts]
policymap = "policymap.run:main"

[tool.setuptools]
packages = [
  "policymap",
  "policymap.collectors",
  "policymap.parsers",
  "policymap.graph",
  "policymap.mcp_server",
]

[tool.setuptools.package-data]
policymap = ["../db/schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
